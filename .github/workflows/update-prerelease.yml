name: Build and Update Beta-Release

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Update Tag and Beta-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git author for tag creation
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Extract version from manifest.json using jq
          VERSION=$(jq -r .version manifest.json)
          TAG_NAME="v${VERSION}-beta"
          
          echo "Target tag is $TAG_NAME"

          # 2. Fetch existing tags
          git fetch --tags

          # 3. Create or update the current beta tag FIRST
          git tag -f "$TAG_NAME"
          git push -f origin "$TAG_NAME"

          # 4. Create release if missing, or update if it exists
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --prerelease --title "Beta Release ($TAG_NAME)" --notes "Automated beta build"

          # 5. Upload assets
          gh release upload "$TAG_NAME" main.js styles.css manifest.json --clobber

          # 6. Find old tags to delete (Keep the 5 highest versions)
          # --sort=-v:refname sorts tags by semantic version descending (highest version at the top)
          ALL_BETA_TAGS=$(git tag -l "*-beta" --sort=-v:refname)
          
          # Use tail to skip the first 5 tags and capture the rest for deletion
          TAGS_TO_DELETE=$(echo "$ALL_BETA_TAGS" | tail -n +6)

          # 7. Delete the older tags
          if [ -n "$TAGS_TO_DELETE" ]; then
            for tag in $TAGS_TO_DELETE; do
              echo "Cleaning up old beta: $tag"
              
              # Delete the GitHub release and its underlying tag
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
              
              # Delete remote tag
              git push origin --delete "$tag" 2>/dev/null || true
              
              # Delete local tag
              git tag -d "$tag" 2>/dev/null || true
            done
          else
            echo "Fewer than 5 beta releases exist. No cleanup needed."
          fi