name: Build and Update Pre-Release

on:
  push:
    branches:
      - beta

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Update Tag and Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git author for tag creation
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG_NAME="v1.1.0-beta"

          # Create or move tag
          git tag -f $TAG_NAME
          git push -f origin $TAG_NAME

          # Create release if missing, or update if exists
          gh release view $TAG_NAME >/dev/null 2>&1 || gh release create $TAG_NAME --prerelease --title "Latest Beta Build" --notes "Automated beta build"

          # Upload assets
          gh release upload $TAG_NAME main.js styles.css manifest.json --clobber
