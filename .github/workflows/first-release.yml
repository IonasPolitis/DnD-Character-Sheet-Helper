name: First Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: First Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git author for tag creation
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Extract version from manifest.json using jq
          VERSION=$(jq -r .version manifest.json)
          TAG_NAME="${VERSION}"
          
          echo "Target tag is $TAG_NAME"

          git fetch --tags

          git tag -f "$TAG_NAME"
          git push -f origin "$TAG_NAME"

          # 4. Create release if missing, or update if it exists
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "First Public Release - $TAG_NAME" --notes "Hopefully added to the Obsidian Community plugin Store."

          # 5. Upload assets
          gh release upload "$TAG_NAME" main.js styles.css manifest.json --clobber
