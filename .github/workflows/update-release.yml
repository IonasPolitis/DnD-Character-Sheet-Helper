name: Update Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git author for tag creation
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(jq -r .version manifest.json)
          TAG_NAME="${VERSION}"

          NOTES=$(jq -r .notes release-notes.json)

          echo "Target tag is $TAG_NAME"

          git fetch --tags

          echo "Searching for pre-releases and tags matching ${TAG_NAME}..."
          CANDIDATE_TAGS=$( { git tag -l; gh release list --limit 1000 --json tagName -q '.[].tagName' 2>/dev/null || true; } | sort -u )

          for tag in $CANDIDATE_TAGS; do
            case "$tag" in
              "$TAG_NAME"[!0-9.]*)
                echo "Deleting pre-release / tag: $tag"
                gh release delete "$tag" --cleanup-tag -y 2>/dev/null || true
                git push origin --delete "$tag" 2>/dev/null || true
                git tag -d "$tag" 2>/dev/null || true
                ;;
            esac
          done

          git tag -f "$TAG_NAME"
          git push -f origin "$TAG_NAME"

          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "$NOTES"

          gh release upload "$TAG_NAME" main.js styles.css manifest.json --clobber
