name: Update Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git author for tag creation
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(jq -r .version manifest.json)
          TAG_NAME="${VERSION}"

          NOTES=""

          echo "Target tag is $TAG_NAME"

          git fetch --tags

          git tag -f "$TAG_NAME"
          git push -f origin "$TAG_NAME"

          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "$NOTES"

          gh release upload "$TAG_NAME" main.js styles.css manifest.json --clobber

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json